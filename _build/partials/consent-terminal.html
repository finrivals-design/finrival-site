  <!-- Cookie banner for the Web Terminal (one page for every language: /assets/js/track.js picks
       the copy from data-copy by browser language). Styles are inline: the Terminal does not load site.css -->
  <style>
    #consent { position: fixed; left: 50%; bottom: 20px; z-index: 2147483000; display: flex; align-items: center; gap: 20px;
      width: min(760px, calc(100% - 32px)); padding: 16px 16px 16px 22px; box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(13,19,26,.96);
      box-shadow: 0 24px 60px rgba(0,0,0,.5); transform: translateX(-50%);
      color: #a7b1bd; font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
    #consent[hidden] { display: none; }
    #consent p { flex: 1; margin: 0; }
    #consent a { color: #f2f5f8; text-decoration: underline; text-underline-offset: 3px; }
    #consent .consent__actions { display: flex; gap: 8px; flex-shrink: 0; }
    #consent button { height: 40px; padding: 0 18px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
      background: transparent; color: #f2f5f8; font: inherit; font-weight: 600; cursor: pointer; }
    #consent button:hover { border-color: #a7b1bd; background: rgba(255,255,255,.06); }
    @media (max-width: 640px) {
      #consent { flex-direction: column; align-items: stretch; gap: 14px; bottom: 12px; padding: 16px; }
      #consent button { flex: 1; }
    }
  </style>
  <div id="consent" role="dialog" aria-live="polite" aria-labelledby="consent-text" data-copy="{{@consentCopy}}" hidden>
    <p id="consent-text"><span data-text></span><a href="/privacy/"></a></p>
    <div class="consent__actions">
      <button type="button" data-consent="denied"></button>
      <button type="button" data-consent="granted"></button>
    </div>
  </div>
