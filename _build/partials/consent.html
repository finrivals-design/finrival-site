  <!-- ========== Cookie consent ========== -->
  <div class="consent" id="consent" role="dialog" aria-live="polite" aria-labelledby="consent-text" hidden>
    <p id="consent-text">{{consent.text}} · <a href="{{@link:/privacy/}}">{{consent.policy}}</a></p>
    <div class="consent__actions">
      <button type="button" class="consent__btn" data-consent="denied">{{consent.reject}}</button>
      <button type="button" class="consent__btn" data-consent="granted">{{consent.accept}}</button>
    </div>
  </div>
  <script>
    (function () {
      var KEY = 'finrival-consent';
      var box = document.getElementById('consent');
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      if (stored !== 'granted' && stored !== 'denied') box.hidden = false;

      function choose(value) {
        try { localStorage.setItem(KEY, value); } catch (e) {}
        gtag('consent', 'update', { ad_storage: value, ad_user_data: value, ad_personalization: value, analytics_storage: value });
        dataLayer.push({ event: 'consent_update', consent: value });
        box.hidden = true;
      }
      box.querySelectorAll('[data-consent]').forEach(function (b) {
        b.addEventListener('click', function () { choose(b.getAttribute('data-consent')); });
      });
      document.querySelectorAll('[data-consent-open]').forEach(function (b) {
        b.addEventListener('click', function () { box.hidden = false; box.querySelector('button').focus(); });
      });

      // Conversion signal: a click on any App Store link. In Tag Manager, trigger the
      // Google Ads conversion tag on the custom event "app_store_click"
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href*="apps.apple.com"]');
        if (a) dataLayer.push({ event: 'app_store_click', link_url: a.href, page_language: document.documentElement.lang });
      });
    })();
  </script>
