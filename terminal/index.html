  <script>
    // Polar adds customer_session_token (a short-lived customer portal key) when buyers return to
    // the Web Terminal. Drop it from the address before any Google tag can read the URL
    try {
      var u = new URL(location.href);
      if (u.searchParams.has('customer_session_token')) {
        u.searchParams.delete('customer_session_token');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      }
    } catch (e) {}
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied' });
    gtag('set', 'ads_data_redaction', true);
    gtag('set', 'url_passthrough', true);
    try {
      if (localStorage.getItem('finrival-consent-v2') === 'granted') {
        gtag('consent', 'update', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' });
      }
    } catch (e) {}
    gtag('js', new Date());
    gtag('config', 'AW-18535453558'); // Google Ads (conversions in /assets/js/track.js)
    gtag('config', 'G-H7WZNQXEYJ'); // Google Analytics, web stream "Finrival Client" of property finrival-dc2a7
  </script>
